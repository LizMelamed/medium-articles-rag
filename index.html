<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medium Article RAG Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #20201d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(760px, 100%);
        background: #ffffff;
        border: 1px solid #dfdfd7;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 45px rgba(30, 30, 26, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.08;
      }

      p {
        margin: 0 0 22px;
        color: #55554c;
        line-height: 1.55;
      }

      form {
        display: grid;
        gap: 12px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
        padding: 14px;
        border: 1px solid #c9c9bf;
        border-radius: 8px;
        font: inherit;
      }

      button {
        justify-self: start;
        border: 0;
        border-radius: 8px;
        background: #1f7a4d;
        color: white;
        padding: 11px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      pre {
        margin: 18px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f0f0eb;
        border-radius: 8px;
        padding: 16px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Medium Article RAG Assistant</h1>
      <p>Ask questions that can be answered from the indexed Medium article dataset.</p>
      <form id="prompt-form">
        <textarea id="question" required>List exactly 3 articles about education. Return only the titles.</textarea>
        <button type="submit">Ask</button>
      </form>
      <pre id="output">The API endpoints are /api/prompt and /api/stats.</pre>
    </main>
    <script>
      const form = document.querySelector("#prompt-form");
      const button = form.querySelector("button");
      const output = document.querySelector("#output");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        output.textContent = "Thinking...";

        try {
          const response = await fetch("/api/prompt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: document.querySelector("#question").value })
          });
          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
